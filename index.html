<!DOCTYPE html>
<html lang="de">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Verknüpfung zur manifest.json -->
<link rel="manifest" href="manifest.json">

<!-- Spezielle Befehle, damit iOS das App-Layout und Icon perfekt übernimmt -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Den Service Worker (sw.js) im Hintergrund aktivieren -->

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>    
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hans Huckebein Kaffeekasse</title>
    <!-- EmailJS SDK für den Hintergrundversand -->
    <script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
    <script type="text/javascript">
    (function () {
        emailjs.init({
            publicKey: "AVgYV4iHyJiRXlYm_"
        });
    })();
</script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 24px; }
        .saldo-box { border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; background: #f0fdf4; border: 2px solid #bbf7d0; }
        .saldo-title { font-size: 14px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .saldo-amount { font-size: 32px; font-weight: bold; margin: 5px 0; color: #27ae60; }
        .btn { width: 100%; padding: 14px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; color: white; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .btn-item { background-color: #2c3e50; }
        .btn-fruehstueck { background-color: #27ae60; }
        
        /* Stil für das Info-Abzeichen (wird erst nach Buchung sichtbar) */
        .fruehstueck-badge { display: none; background-color: #27ae60; color: white !important; font-size: 11px; padding: 3px 8px; border-radius: 6px; margin-left: 10px; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .btn-expensive { background-color: #bdc3c7 !important; color: #7f8c8d !important; cursor: not-allowed; pointer-events: none; }
        /* KORREKTUR: Alle Spans im gesperrten Button werden grau, AUSSER das Info-Zeichen (Badge)! */
        .btn-expensive span:not(.fruehstueck-badge) { color: #7f8c8d !important; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn-paypal { background-color: #0070ba; justify-content: center; font-size: 14px; margin: 0; }
        .btn-cash { background-color: #8e44ad; justify-content: center; font-size: 14px; margin: 0; }
        .status-msg { text-align: center; font-weight: bold; padding: 12px; margin: 15px 0; border-radius: 6px; display: none; }
        .status-success { background-color: #d4edda; color: #155724; display: block; }
        .status-error { background-color: #f8d7da; color: #721c24; display: block; }
        .footer-links { text-align: center; margin-top: 25px; font-size: 11px; color: #95a5a6; }

        .paypal-dropdown { display: none; margin-top: 8px; grid-column: span 2; background: #f8f9fa; border: 1px solid #dcdde1; padding: 10px; border-radius: 8px; text-align: center; }
        .paypal-dropdown-title { font-size: 12px; font-weight: bold; color: #7f8c8d; text-transform: uppercase; margin-bottom: 8px; }
        .paypal-btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-pp-sub { background-color: #00457c; padding: 10px; font-size: 13px; justify-content: center; margin: 0; }
        .btn-pp-sub:hover { background-color: #002c53; }

        .cash-dropdown { display: none; margin-top: 8px; grid-column: span 2; background: #f8f9fa; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; text-align: center; box-sizing: border-box; }
        .cash-input-group { display: flex; gap: 8px; margin-top: 5px; }
        .cash-input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; text-align: center; font-weight: bold; letter-spacing: 2px; }
        .btn-cash-submit { background-color: #8e44ad; justify-content: center; font-size: 14px; margin: 0; width: auto; padding: 10px 18px; }

        .confirm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .confirm-box { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        .confirm-box p { font-size: 16px; font-weight: bold; color: #2c3e50; margin: 0 0 20px 0; line-height: 1.4; }
        .confirm-buttons { display: flex; gap: 10px; }
        .confirm-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-confirm-yes { background-color: #27ae60; color: white; }
        .btn-confirm-no { background-color: #ecf0f1; color: #7f8c8d; }
    </style>
</head>
<body onload="init()">

<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <p id="confirmMessage">Produkt buchen?</p>
        <div class="confirm-buttons">
            <button class="btn-confirm-no" onclick="closeConfirm(false)">Abbrechen</button>
            <button class="btn-confirm-yes" onclick="closeConfirm(true)">Jetzt buchen</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>☕ Hans Huckebein Kaffeekasse</h1>

    <div class="saldo-box">
        <div class="saldo-title">Dein Guthaben</div>
        <div class="saldo-amount" id="my-saldo">0,00 €</div>
        <div id="saldo-subtext" style="font-size: 12px; color: #95a5a6;">Einsatzbereit</div>
    </div>

    <div id="status" class="status-msg"></div>

    <div style="margin-top: 15px;">
        <div style="font-weight: bold; margin-bottom: 5px; color: #7f8c8d; font-size: 12px; text-transform: uppercase;">Manuell buchen:</div>
        <button id="btn-kaffee" class="btn btn-item" onclick="book(0.50, 'Automaten Kaffee')"><span>☕ Automaten Kaffee</span> <span>0,50 €</span></button>
        <button id="btn-cappuccino" class="btn btn-item" onclick="book(0.60, 'Cappuccino')"><span>🥛 Cappuccino</span> <span>0,60 €</span></button>
        <button id="btn-wasser" class="btn btn-item" onclick="book(0.60, 'Wasser 0,7L')"><span>💧 Wasser 0,7L</span> <span>0,60 €</span></button>
        <button id="btn-soft33" class="btn btn-item" onclick="book(0.90, 'Softdrink 0,33L')"><span>🥤 Softdrink 0,33L</span> <span>0,90 €</span></button>
        <button id="btn-soft5" class="btn btn-item" onclick="book(0.90, 'Softdrink 0,5L')"><span>🥤 Softdrink 0,5L</span> <span>0,90 €</span></button>
        <button id="btn-schokokl" class="btn btn-item" onclick="book(0.30, 'Schokoriegel klein')"><span>🍫 Schokoriegel klein</span> <span>0,30 €</span></button>
        <button id="btn-schokogr" class="btn btn-item" onclick="book(0.60, 'Schokoriegel groß')"><span>🍫 Schokoriegel groß</span> <span>0,60 €</span></button>
        <button id="btn-eis" class="btn btn-item" onclick="book(0.50, 'Eiscreme')"><span>🍦 Eiscreme</span> <span>0,50 €</span></button>
        <button id="btn-fruehstueck" class="btn btn-fruehstueck" onclick="book(4.00, 'Freitagsfrühstück', true)">
            <span>🥐 Freitagsfrühstück <span id="fruehstueckBadge" class="fruehstueck-badge"></span></span> 
            <span>4,00 €</span>
        </button>
    </div>

    <div style="font-weight: bold; margin-top: 25px; margin-bottom: 5px; color: #7f8c8d; font-size: 12px; text-transform: uppercase;">Guthaben aufladen:</div>
    <div class="action-grid">
        <button class="btn btn-cash" onclick="addCashWithCode()">💵 Bar-Aufladung</button>
        <button class="btn btn-paypal" onclick="togglePaypalMenu()">📱 per PayPal</button>
        
        <div id="cashMenu" class="cash-dropdown">
            <div style="font-size: 12px; font-weight: bold; color: #7f8c8d; text-transform: uppercase; margin-bottom: 8px;">Code eingeben:</div>
            <div class="cash-input-group">
                <input type="text" id="otpInput" class="cash-input" placeholder="6-stelliger Code" maxlength="8" autocomplete="off">
                <button class="btn btn-cash-submit" onclick="executeCashDeposit()">Einlösen</button>
            </div>
        </div>
<div id="paypalMenu" class="paypal-dropdown">
            <div class="paypal-dropdown-title">Betrag wählen:</div>
            <div class="paypal-btn-grid">
                <button class="btn btn-pp-sub" onclick="executePaypalDeposit(5)">5 €</button>
                <button class="btn btn-pp-sub" onclick="executePaypalDeposit(10)">10 €</button>
                <button class="btn btn-pp-sub" onclick="executePaypalDeposit(15)">15 €</button>
            </div>
        </div>
    </div>

    <div class="footer-links">
        Sicherungscode: <span id="backupCodeDisplay" style="font-weight: bold; color: #7f8c8d;">------</span>
        <br><br>
        
    </div>
</div>
<script>
    const paypalMeName = "HansHuckebein699"; 
    
    const CODE_MULTIPLIER = 1307;
    const DAY_MULTIPLIER = 713;
    const CODE_OFFSET = 418952;

    let meinSaldo = 0.00;
    let usedCodes = [];
    let lastBreakfastWeek = ""; 
    let benutzerName = "Unbekannter Teilnehmer"; // Speichert den Namen des Gerätenutzers

    function init() { 
        try {
            if (localStorage.getItem('kaffeekasse_saldo_final') === null) {
                localStorage.setItem('kaffeekasse_saldo_final', '0.00');
            }
            meinSaldo = parseFloat(localStorage.getItem('kaffeekasse_saldo_final'));
            
            if (localStorage.getItem('kaffeekasse_used_codes') !== null) {
                usedCodes = JSON.parse(localStorage.getItem('kaffeekasse_used_codes'));
            }
            
            if (localStorage.getItem('kaffeekasse_last_breakfast') !== null) {
                lastBreakfastWeek = localStorage.getItem('kaffeekasse_last_breakfast');
            }

            // Frägt beim ersten Start nach dem Namen des Nutzers
            if (localStorage.getItem('kaffeekasse_user_name') === null) {
                let nameInput = prompt("Herzlich Willkommen bei Hans Huckebein\n\nBitte gib zur Freigabe der App deinen Namen ein:");
                if (nameInput && nameInput.trim() !== "") {
                    localStorage.setItem('kaffeekasse_user_name', nameInput.trim());
                } else {
                    localStorage.setItem('kaffeekasse_user_name', "Anonymer Teilnehmer");
                }
            }
            benutzerName = localStorage.getItem('kaffeekasse_user_name');
            
            // Zeigt den Namen im Infofeld an
            document.getElementById('saldo-subtext').textContent = "Einsatzbereit - Kasse von " + benutzerName;

        } catch (e) {
            console.log("LocalStorage eingeschränkt.");
            document.getElementById('saldo-subtext').textContent = "Test-Modus";
        }
        
        checkPendingPaypalCode();
        updateSaldoDisplay(); 
    }

    function updateSaldoDisplay() {
        document.getElementById('my-saldo').textContent = meinSaldo.toFixed(2).replace('.', ',') + " €";
        
        updateButtonState('btn-kaffee', 0.50);
        updateButtonState('btn-cappuccino', 0.60);
        updateButtonState('btn-wasser', 0.60);
        updateButtonState('btn-soft33', 0.90);
        updateButtonState('btn-soft5', 0.90);
        updateButtonState('btn-schokokl', 0.30);
        updateButtonState('btn-schokogr', 0.60);
        updateButtonState('btn-eis', 0.50);
        updateButtonState('btn-fruehstueck', 4.00);

        const currentDay = new Date().getDate();
        const secureBackupCode = Math.round((meinSaldo * CODE_MULTIPLIER) + (currentDay * DAY_MULTIPLIER) + CODE_OFFSET);
        document.getElementById('backupCodeDisplay').textContent = secureBackupCode;

        try {
            localStorage.setItem('kaffeekasse_saldo_final', meinSaldo.toString());
        } catch(e) {}

        if (typeof checkFruehstueckDeadline === "function") {
            checkFruehstueckDeadline();
        }
    }

    function updateButtonState(buttonId, price) {
        const btn = document.getElementById(buttonId);
        if (!btn) return;
        
        if (buttonId === 'btn-fruehstueck' && typeof checkFruehstueckSperre === "function" && checkFruehstueckSperre()) {
            btn.classList.add('btn-expensive');
            return;
        }

        if (meinSaldo < price) { btn.classList.add('btn-expensive'); } 
        else { btn.classList.remove('btn-expensive'); }
    }

    let pendingAmount = 0;
    let pendingItemName = "";
function getCalendarWeek(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getCurrentWeekKey() {
        const now = new Date();
        return now.getFullYear() + "-" + getCalendarWeek(now);
    }

    function checkFruehstueckSperre() {
        const now = new Date();
        const day = now.getDay(); 
        const hour = now.getHours();

        if (lastBreakfastWeek === getCurrentWeekKey()) {
            return true;
        }

        if (day === 5 && hour >= 8) {
            return true;
        }

        if (day === 6 || day === 0) {
            return true;
        }

        return false;
    }

    function book(amount, itemName, triggerEmail = false) {
        if (itemName === 'Freitagsfrühstück' && checkFruehstueckSperre()) {
            if (lastBreakfastWeek === getCurrentWeekKey()) {
                showStatus("Du hast das Freitagsfrühstück für diese Woche bereits gebucht!", false);
            } else {
                showStatus("Die Buchungsfrist (Freitag 08:00 Uhr) ist für diese Woche abgelaufen!", false);
            }
            return false;
        }

        if (meinSaldo < amount) {
            showStatus(`Guthaben zu gering! Du benötigst ${amount.toFixed(2).replace('.', ',')} € für ${itemName}.`, false);
            return false;
        }
        
        pendingAmount = amount;
        pendingItemName = itemName;
        window.pendingEmailTrigger = triggerEmail;

        document.getElementById('confirmMessage').innerHTML = `${itemName}<br>für ${amount.toFixed(2).replace('.', ',')} € wirklich buchen?`;
        document.getElementById('confirmOverlay').style.display = 'flex';
    }

    function closeConfirm(isConfirmed) {
        document.getElementById('confirmOverlay').style.display = 'none';
        
        if (isConfirmed && pendingAmount > 0) {
            meinSaldo -= pendingAmount;
            
            if (pendingItemName === 'Freitagsfrühstück') {
                lastBreakfastWeek = getCurrentWeekKey();
                try {
                    localStorage.setItem('kaffeekasse_last_breakfast', lastBreakfastWeek);
                } catch(e) {}
            }

            updateSaldoDisplay();
            showStatus(`Gebucht: ${pendingItemName} (-${pendingAmount.toFixed(2).replace('.', ',')} €)`, true);
            
            if (window.pendingEmailTrigger) {
                sendBackgroundEmail(pendingItemName);
            }
        }
        
        pendingAmount = 0;
        pendingItemName = "";
        window.pendingEmailTrigger = false;
    }

    function sendBackgroundEmail(itemName) {
        const templateParams = {
            item: itemName,
            user: benutzerName, // Übergibt den Namen des Teilnehmers an EmailJS
            timestamp: new Date().toLocaleString('de-DE')
        };

        emailjs.send("service_j85pq0k", "template_7an5vbo", templateParams)
            .then(function(response) {
                console.log('E-Mail im Hintergrund gesendet!');
            }, function(error) {
                console.error('Fehler beim E-Mail-Versand:', error);
            });
    }

    function showStatus(msg, isSuccess) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = msg; 
        statusDiv.style.display = "block";
        statusDiv.className = "status-msg " + (isSuccess ? "status-success" : "status-error");
    }

    function addCashWithCode() {
        document.getElementById('paypalMenu').style.display = "none";
        const menu = document.getElementById('cashMenu');
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function executeCashDeposit() {
        const inputField = document.getElementById('otpInput');
        const codeInput = inputField.value.trim();
        const codeNumber = parseInt(codeInput);

        if (codeInput.length < 6 || isNaN(codeNumber)) {
            showStatus("Ungültiges Code-Format!", false);
            return;
        }

        if (usedCodes.includes(codeInput)) {
            showStatus("Dieser Code wurde bereits verwendet!", false);
            return;
        }

        const currentDay = new Date().getDate();
        const calculatedAmount = Math.round((codeNumber - CODE_OFFSET - (currentDay * DAY_MULTIPLIER)) / CODE_MULTIPLIER * 100) / 100;

        if (calculatedAmount > 0 && calculatedAmount <= 100) {
            usedCodes.push(codeInput);
            try {
                localStorage.setItem('kaffeekasse_used_codes', JSON.stringify(usedCodes));
                localStorage.removeItem('kaffeekasse_pending_code');
            } catch(e) {}

            meinSaldo += calculatedAmount; 
            updateSaldoDisplay();
            showStatus(`${calculatedAmount.toFixed(2).replace('.', ',')} € erfolgreich aufgeladen!`, true);
            inputField.value = ''; 
            document.getElementById('cashMenu').style.display = "none"; 
        } else {
            showStatus("Ungültiger oder für heute abgelaufener Code!", false);
        }
    }

    function togglePaypalMenu() {
        document.getElementById('cashMenu').style.display = "none";
        const menu = document.getElementById('paypalMenu');
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

function executePaypalDeposit(betrag) {
    const currentDay = new Date().getDate();

    const passenderCode =
        (betrag * CODE_MULTIPLIER) +
        (currentDay * DAY_MULTIPLIER) +
        CODE_OFFSET;

    try {
        localStorage.setItem(
            'kaffeekasse_pending_code',
            passenderCode.toString()
        );
    } catch (e) {}

    // E-Mail über die gestartete Aufladung
    const templateParams = {
        user: benutzerName,
        amount: betrag.toFixed(2).replace('.', ','),
        timestamp: new Date().toLocaleString('de-DE')
    };

    emailjs.send(
        "service_j85pq0k",
        "template_3eki0ij",
        templateParams
    ).then(function(response) {
        console.log('PayPal-Aufladungs-E-Mail versendet.');
    }).catch(function(error) {
        console.error(
            'Fehler beim E-Mail-Versand:',
            error
        );
    });

    // Weiterleitung zu PayPal
    const paypalUrl =
        `https://paypal.me/${paypalMeName}/${betrag}`;

    window.location.href = paypalUrl;
}

    function checkPendingPaypalCode() {
        try {
            const pendingCode = localStorage.getItem('kaffeekasse_pending_code');
            if (pendingCode) {
                document.getElementById('cashMenu').style.display = "block";
                document.getElementById('otpInput').value = pendingCode;
                
                showStatus(`Willkommen zurück!<br>Dein Code <strong>${pendingCode}</strong> wurde unten eingetragen.<br><small>Bitte nur einlösen, wenn die PayPal-Zahlung erfolgreich war!</small>`, true);
            }
        } catch(e) {}
    }

    // Zeitanzeige-Logik: Durch die CSS-:not-Korrektur leuchtet das Abzeichen jetzt in reinem Weiß
    function checkFruehstueckDeadline() {
        const now = new Date();
        const day = now.getDay(); 
        const hour = now.getHours();
        const badge = document.getElementById('fruehstueckBadge');
        
        if (!badge) return;

        if (lastBreakfastWeek === getCurrentWeekKey()) {
            if (day === 5) {
                if (hour < 9) {
                    badge.textContent = "✓ Bereits gebucht";
                    badge.style.backgroundColor = "#27ae60"; // Grüner Hintergrund
                    badge.style.color = "#ffffff";           // Weiße Schrift
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none'; 
                }
            } 
            else {
                badge.textContent = "✓ Bereits gebucht";
                badge.style.backgroundColor = "#27ae60";     // Grüner Hintergrund
                badge.style.color = "#ffffff";               // Weiße Schrift
                badge.style.display = 'inline-block';
            }
        } else {
            badge.style.display = 'none';
        }
    }

    

    checkFruehstueckDeadline();
</script>

</body>
</html>
